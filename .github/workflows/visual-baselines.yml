name: visual-baselines

# The ONLY place screenshot baselines may be created.
#
# They are byte-compared and Linux and macOS rasterise fonts differently, so a
# baseline written on a developer's machine fails every CI run. The test suite
# refuses to write them off Linux; this workflow is the sanctioned path.
#
# Manual by design. Regenerating baselines is how a visual regression gets
# accepted as intended, so it should be a decision someone takes and reviews in
# a diff, never something a push does on its own.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why the baselines are being regenerated (goes in the commit message)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The suite screenshots the prerendered output, so it has to exist first.
      - run: pnpm run build

      - run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Write baselines
        run: pnpm --filter docs run test:visual:update

      # A second pass against what was just written. If it fails, the captures
      # are not reproducible on this very runner, and committing them would hand
      # every future PR a flaky gate.
      - name: Prove the baselines reproduce
        run: pnpm --filter docs run test:visual

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add apps/docs/tests/__screenshots__
          if git diff --cached --quiet; then
            echo "::notice::Baselines are unchanged; nothing to commit."
            exit 0
          fi
          COUNT=$(find apps/docs/tests/__screenshots__ -name '*.png' | wc -l | tr -d ' ')
          git commit -m "chore(docs): regenerate screenshot baselines on linux

          ${{ inputs.reason }}

          $COUNT baselines. Generated by the visual-baselines workflow, which is
          the only sanctioned path: they are byte-compared and macOS font
          rasterisation does not match this runner."
          git push
