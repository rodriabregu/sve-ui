name: CI

on:
  # Every pull request, whatever its base. Filtering on `branches: [main]` meant
  # stacked PRs (base = another feature branch) ran no checks at all, so a broken
  # link in a chain only surfaced after its base had already merged.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run test

      # A formatting sweep without a gate just postpones the next 400-file diff.
      - name: Formatting
        run: pnpm run format:check

      # The rendered structure must match the committed baseline. Runs after
      # build, since it inspects the prerendered output rather than the source.
      - name: Rendered structure unchanged
        run: pnpm --filter docs run check:render

      # The committed prop metadata must match the components it documents.
      - name: Prop tables up to date
        run: pnpm --filter docs run gen:props:check

      # Pixels, not structure. `check:render` compares an element skeleton, so it
      # is blind to the regression that prompted this: in 0.6.1 the
      # DateRangePicker trigger rendered correct markup with no CSS reaching it.
      #
      # Skipped, not failed, when no baselines exist yet — so the suite can land
      # before the first Linux baseline run without blocking every PR.
      - name: Screenshot baselines present
        id: baselines
        run: |
          if [ -d apps/docs/tests/__screenshots__ ] && \
             [ "$(find apps/docs/tests/__screenshots__ -name '*.png' | wc -l)" -gt 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No screenshot baselines committed yet. Generate them with the visual-baselines workflow."
          fi

      - name: Install Chromium
        if: steps.baselines.outputs.present == 'true'
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Visual regression
        if: steps.baselines.outputs.present == 'true'
        run: pnpm --filter docs run test:visual

      - uses: actions/upload-artifact@v4
        if: failure() && steps.baselines.outputs.present == 'true'
        with:
          name: visual-diff
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
          retention-days: 7
