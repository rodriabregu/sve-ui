name: CI

on:
  # Every pull request, whatever its base. Filtering on `branches: [main]` meant
  # stacked PRs (base = another feature branch) ran no checks at all, so a broken
  # link in a chain only surfaced after its base had already merged.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run test

      # The committed prop metadata must match the components it documents.
      - name: Prop tables up to date
        run: pnpm --filter docs run gen:props:check
